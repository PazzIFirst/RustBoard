[workspace]
resolver = "3"
members = [
    "crates/rustboard-common",
    "crates/rustboard-core",
    "crates/rustboard-agent",
    "crates/rustboard-hub",
    "crates/rustboard-panel",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http-body = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
include_dir = "0.7"
libc = "0.2"
# M4-C2：object_store 的 `aws` feature 会强制 aws-lc-rs（cmake），
# 因此按 spike 结论拆为 aws-base + reqwest + ring（纯 rustls/ring）。
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
# v0.3.3：Panel 支持 https://hub。选 native roots + ring provider：
# - `rustls-tls-native-roots` 的内部依赖包含 `__rustls-ring`，不会引入 aws-lc/cmake；
# - 用系统信任库；Panel 配置 `hub_ca` 时只信任该私有 CA（见 panel/src/proxy.rs）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rmp-serde = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"

rustboard-common = { path = "crates/rustboard-common" }
rustboard-core = { path = "crates/rustboard-core" }

# M4-C3：vendored `russh` 0.60.3 + 它使用的 forked `ssh-key`，只删除 optional
# `rsa` 依赖 / feature（含 `std` 中的弱引用 `rsa?/std` 与 `crypto` feature 里的
# `rsa`），让 `cargo audit` 不再命中 RUSTSEC-2023-0071（rsa Marvin，无修复版本）。
# 两个 crate 的 src 与 crates.io 发布包一致；重新生成方式见 vendor/README.md。
[patch.crates-io]
russh = { path = "vendor/russh" }
internal-russh-forked-ssh-key = { path = "vendor/ssh-key" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
