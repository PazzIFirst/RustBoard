[package]
name = "rustboard-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustboard-hub"
path = "src/main.rs"

[dependencies]
rustboard-common = { workspace = true }
rustboard-core = { workspace = true }
rustboard-install = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
# object_store 0.14 的 HTTP 传输使用 reqwest 0.13；显式启用 rustls（ring provider），
# 避免 object_store 的 `aws` feature 拉入 aws-lc-rs。此别名不直接在代码中使用，
# 只用于给 object_store 的传递依赖打开 TLS feature（provider 在 archive_s3.rs 安装）。
reqwest13 = { package = "reqwest", version = "0.13.3", default-features = false, features = ["rustls-no-provider", "http2"] }
object_store = { workspace = true }
# M4-C3：SFTP 冷存储。显式关闭默认 aws-lc-rs，改用纯 Rust `ring`；不启用 rsa。
# 根 Cargo.toml 的 `[patch.crates-io]` 把 russh 0.64.1 / ssh-key 指到 vendor（删 optional rsa）。
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
# 只对 AsyncRead/AsyncWrite 泛型，不直接依赖 russh。
russh-sftp = "3.0.1"
rustls = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `#[tokio::test(start_paused = true)]`：用虚拟时间验证空闲超时，仅测试构建启用。
tokio = { workspace = true, features = ["test-util"] }
