[package]
name = "m4-deps-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false
description = "M4 冷归档依赖 spike（object_store / russh / flate2 / hmac），不进入根 workspace"

# 独立 spike 工程：空的 [workspace] 阻止 Cargo 向上寻找根 workspace。
# 根 workspace 的 members 是显式列表，也不会包含本目录。
[workspace]

# MSRV 1.80 的关键传递依赖锁定（由 Cargo.lock 固化，理由见 REPORT.md §3）：
# tokio 1.53.3、tokio-util 0.7.19、hyper-util 0.1.20、hyper-rustls 0.27.7、
# indexmap 2.11.4（hashbrown 0.16.1）、ed25519-dalek 2.1.1、zeroize 1.8.2、
# home 0.5.9、idna_adapter 1.2.0（icu 1.5）、litemap 0.7.4、
# quinn 0.11.9 / quinn-proto 0.11.14 / quinn-udp 0.5.14（未启用的可选 http3 依赖）。
# 注意：不要直接 `cargo update`，否则会重新拉到需要 Rust 1.85 的版本。

[dependencies]
anyhow = "1"
async-trait = "=0.1.92"
# 冷归档压缩：只用纯 Rust 的 miniz_oxide 后端，禁止 C zlib（不引入 cc/cmake）。
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# 与仓库现有 sha2 0.10.9 配对（digest 0.10）；hmac 0.13 需要 digest 0.11 / rustc 1.85。
hmac = "=0.12.1"
# 仅 AWS：自定义 endpoint / path_style / 静态凭证；默认特性（fs）关闭。
object_store = { version = "=0.11.2", default-features = false, features = ["aws"] }
# 纯 Rust SSH：显式关闭默认 aws-lc-rs，改用 ring。
# russh 0.53 的 RSA 支持由内置 rsa 0.9 提供（无独立 feature）；ed25519 由 ssh-key 提供。
russh = { version = "=0.53.0", default-features = false, features = ["ring"] }
# russh-sftp 3.0.1 不依赖 russh（仅对 AsyncRead/AsyncWrite 泛型），与 russh 0.5x 可自由组合。
russh-sftp = "=3.0.1"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
