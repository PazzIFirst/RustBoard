# RustBoard Docker Compose 示例（Phase B/C）。
#
# 使用前请：
# 1. 准备 dist/<arch>/bin 与 web/dist，构建三个镜像（见 docker/README.md）；
# 2. 把下面的 hub.example.com、RUSTBOARD_* 占位符换成真实值；
# 3. 不要把 8444 发布到宿主；不要给 panel 添加 ports。
#
# 启动 hub + panel：
#   RUSTBOARD_VERSION=v1.0.0 docker compose -f docker/compose.example.yml up -d
# 启动 agent（默认不启动）：
#   RUSTBOARD_VERSION=v1.0.0 docker compose -f docker/compose.example.yml --profile agent up -d
#
# TLS 默认是 self-signed，安装阶段自动 --offline（与 Phase B 一致）。
# 需要 ACME（HTTP-01 / TLS-ALPN-01）时改用叠加文件；它会给 hub 发布 80/443，
# 并把 RUSTBOARD_TLS_MODE 切到 acme-domain：
#   docker compose -f docker/compose.example.yml \
#     -f docker/compose.acme.example.yml up -d
# 本文件默认不发布 80/443，避免不需要 ACME 的部署多开端口。
#
# agent 的 Trust 模式：self-signed hub 用 fingerprint（默认）；公共 ACME hub
# 用 system-roots（compose.acme.example.yml 会一并切换）；私有 ACME 或私有
# CA 用 custom-ca + compose.agent-custom-ca.example.yml 只读挂载服务端 CA。
# 这些变量只在 agent 首次初始化时生效，之后以 agent.toml 为准。
#
# 数据库默认 SQLite（hub_data volume 内），本文件**不**包含 PostgreSQL service。
# 需要显式 opt-in PostgreSQL 时叠加专用文件（不是默认行为）：
#   docker compose -f docker/compose.example.yml \
#     -f docker/compose.postgres.example.yml up -d
# 首次初始化后 RUSTBOARD_DATABASE 不再生效；切换/迁移见 docker/README.md §14。
#
# 注意：hub 与 panel 共享 network namespace。panel 必须通过 127.0.0.1:8444
# 访问 hub 管理 API；默认管理口仍是回环明文。`RUSTBOARD_ADMIN_TLS=required`
# 可启用管理端 HTTPS，但必须同时覆盖 healthcheck（见 docker/README.md §8）。

name: rustboard

services:
  hub:
    image: ghcr.io/pazzifirst/rustboard-hub:${RUSTBOARD_VERSION:-latest}
    hostname: rustboard-hub
    restart: unless-stopped
    ports:
      # agent 接入（mTLS），需要对外。
      - "8443:8443"
      # panel 监听在 hub 的 network namespace 中，由 hub 服务发布 8080。
      # 默认只绑宿主回环；远程访问请用 SSH 隧道 / VPN / 反代。
      - "127.0.0.1:8080:8080"
    volumes:
      - hub_data:/data
      # 可选共享 admin token。它是敏感卷，只给 hub 写、panel 只读挂载。
      - hub_run:/run/rustboard
      # 可选（仅私有 / Pebble ACME）：只读挂载 CA PEM，并把
      # RUSTBOARD_ACME_CA_FILE 设为容器内路径（默认不挂载）。
      # - ./secrets/acme-ca.pem:/run/rustboard/acme-ca.pem:ro
    environment:
      RUSTBOARD_LISTEN: "0.0.0.0:8443"
      RUSTBOARD_ADMIN_LISTEN: "127.0.0.1:8444"
      RUSTBOARD_ADMIN_TOKEN_SHARE: "/run/rustboard/admin_token"
      RUSTBOARD_NAME: "${RUSTBOARD_HUB_NAME:-rustboard-hub}"
      # 默认自签证书；安装阶段 entrypoint 自动追加 --offline。
      RUSTBOARD_TLS_MODE: "self-signed"
      # 可选：管理 API 明文（off，默认，仅回环）或 HTTPS（required）。
      # required 时镜像内置 healthcheck 会失败，必须按 docker/README.md §8 覆盖。
      # RUSTBOARD_ADMIN_TLS: "required"
      # ACME 变量只在首次安装且 RUSTBOARD_TLS_MODE=acme-* 时使用；本文件不启用。
      # 如需 ACME 请用 docker/compose.acme.example.yml 叠加，并把 80/443 发布出去。
      # RUSTBOARD_ACME_EMAIL / RUSTBOARD_ACME_DOMAIN / RUSTBOARD_ACME_CHALLENGE
      # RUSTBOARD_ACME_PROFILE / RUSTBOARD_ACME_CA_FILE / RUSTBOARD_ACME_DIRECTORY
      # 必须换成 agent 实际连接的域名 / IP；它会进入服务端证书 SAN。
      RUSTBOARD_ADVERTISE: "${RUSTBOARD_HUB_ADVERTISE:-hub.example.com}"
      # 可选：额外 SAN，逗号分隔（例如 "10.0.0.10,hub.example.com"）。
      # ACME 模式下证书 SAN 由 ACME 标识决定，这里只影响回退自签的证书。
      RUSTBOARD_SAN: "${RUSTBOARD_HUB_SAN:-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8444/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  panel:
    image: ghcr.io/pazzifirst/rustboard-panel:${RUSTBOARD_VERSION:-latest}
    # 与 hub 共享 loopback，才能访问 127.0.0.1:8444；不要给本服务加 ports。
    network_mode: "service:hub"
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - panel_data:/data
      # 只读挂载 hub 写出的 admin token。该卷含敏感 token。
      - hub_run:/run/rustboard:ro
    environment:
      HUB_URL: "http://127.0.0.1:8444"
      HUB_TOKEN_FILE: "/run/rustboard/admin_token"
      PANEL_LISTEN: "0.0.0.0:8080"
      PANEL_STATIC_DIR: "/usr/share/rustboard/web"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  agent:
    image: ghcr.io/pazzifirst/rustboard-agent:${RUSTBOARD_VERSION:-latest}
    profiles: ["agent"]
    restart: unless-stopped
    volumes:
      - agent_data:/data
      # enrollment token 只以 0600 文件挂载，禁止放进环境变量或镜像。
      - ${RUSTBOARD_ENROLL_TOKEN_FILE:-./secrets/enroll.token}:/run/rustboard/enroll_token:ro
      # 仅 custom-ca：只读挂载服务端 CA PEM。推荐用叠加文件
      # docker/compose.agent-custom-ca.example.yml（自动设置下面的路径和模式）。
      # - ${RUSTBOARD_AGENT_SERVER_CA_FILE:-./secrets/agent-server-ca.pem}:/run/rustboard/server-ca.pem:ro
    environment:
      RUSTBOARD_HUB_URL: "${RUSTBOARD_HUB_URL:-wss://hub.example.com:8443/agent/ws}"
      RUSTBOARD_TOKEN_FILE: "/run/rustboard/enroll_token"
      # 服务端信任模式：fingerprint（默认，自签 hub）/ system-roots（公共
      # ACME 证书）/ custom-ca（私有 ACME / 私有 CA）。只影响首次初始化；
      # 之后以 agent.toml 为准。ACME hub 用 compose.acme.example.yml 叠加，
      # 私有 ACME/私有 CA 再用 compose.agent-custom-ca.example.yml 叠加。
      RUSTBOARD_TLS_MODE: "${RUSTBOARD_AGENT_TLS_MODE:-fingerprint}"
      # custom-ca 的容器内 CA 路径；其他模式必须为空。
      RUSTBOARD_SERVER_CA: "${RUSTBOARD_AGENT_SERVER_CA:-}"
      # fingerprint 模式必填；system-roots 必须留空。custom-ca 以 CA 为信任根，
      # fingerprint 可留空（仅兼容记录，运行时不用于服务端校验）。保留旧变量名
      # RUSTBOARD_HUB_FINGERPRINT；默认空，缺失时 entrypoint 会明确列出变量名。
      RUSTBOARD_FINGERPRINT: "${RUSTBOARD_AGENT_FINGERPRINT:-${RUSTBOARD_HUB_FINGERPRINT:-}}"
      RUSTBOARD_NAME: "${RUSTBOARD_AGENT_NAME:-agent-01}"
    healthcheck:
      # 未完成 enrollment 前必然失败；Dockerfile 给了 90s start-period。
      test: ["CMD", "rustboard-agent", "cert-info", "--config", "/data/etc/rustboard/agent.toml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # 默认非 privileged、不挂 docker.sock、不启用控制面。
    security_opt:
      - no-new-privileges:true

volumes:
  hub_data:
  panel_data:
  # 敏感：包含 hub admin_token。只允许 hub（rw）与 panel（ro）挂载。
  hub_run:
  agent_data:
