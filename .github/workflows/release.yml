name: Release

# 发布流水线：只由 v* tag push 触发。普通 push / PR 不推镜像。
on:
  push:
    tags:
      - "v*"

# 默认最小权限；各 job 按需声明，避免 verify/build 持有 packages/attestation 权限。
permissions:
  contents: read

# 同一 tag 的发布串行执行；不取消正在运行的发布，避免留下半成品 draft。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # 1. 版本/tag/main 祖先与全部门禁。任何失败都不会进入构建与推送。
  # 第一层 #54 门禁：构建前查询目标 $GITHUB_SHA 的 CI check-runs，只信这个 SHA 的
  # 全绿结果；显式授予 checks: read / actions: read（其余 job 保持最小权限）。
  verify:
    name: 校验与发布门禁
    permissions:
      contents: read
      actions: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      # #54 第一层门禁（在任何构建之前）：目标 SHA 的 CI 必须全绿。
      # 只查 $GITHUB_SHA，不回退到 main 最新；缺失、排队/运行中、取消/失败/
      # 超时/中性/跳过、API 非零、JSON 非法一律 fail closed。同一 SHA 的多次
      # attempt：存在任何未完成的同名 check 即拒绝；否则只取最后启动的 completed
      # attempt 判定，避免旧成功掩盖新 attempt 的失败，也允许失败后重跑成功。
      # 同时校验 check run 来自 github-actions 且 check_suite 关联目标 SHA 的
      # .github/workflows/ci.yml push run，防止同名 check 冒名。
      - name: 目标 SHA CI 门禁（fmt/postgres/e2e/web/audit）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY:?GITHUB_REPOSITORY 未设置}"
          sha="${GITHUB_SHA:?GITHUB_SHA 未设置}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          if [ "$owner" = "$repo" ] \
            || [ "$owner" = "." ] || [ "$owner" = ".." ] \
            || [ "$name" = "." ] || [ "$name" = ".." ] \
            || [[ ! "$owner" =~ ^[A-Za-z0-9_.-]+$ ]] \
            || [[ ! "$name" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::GITHUB_REPOSITORY 非法: ${repo}"
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GITHUB_SHA 不是 40 位小写十六进制: ${sha}"
            exit 1
          fi

          # 必须与 ci.yml 的 job 显示名精确一致；名称缺失同样拒绝发布。
          required=(
            "fmt / clippy / test"
            "postgres / Phase D 实库测试"
            "e2e 安全回归"
            "web / tsc / build"
            "cargo audit"
          )

          work_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/sha-ci-gate.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT

          # 读取一页 JSON 并输出条目数；JSON 非法/缺数组一律失败。
          json_page_count() {
            local body=$1 key=$2
            python3 - "$body" "$key" <<'PY'
          import json
          import sys

          path, key = sys.argv[1], sys.argv[2]
          try:
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, ValueError) as exc:
              raise SystemExit(f"{key} JSON 解析失败: {exc}")
          if not isinstance(payload, dict) or not isinstance(payload.get(key), list):
              raise SystemExit(f"{key} 响应缺少 {key} 数组")
          print(len(payload[key]))
          PY
          }

          # 分页取全：每页 100 条。第 20 页仍满时再取第 21 页确认确实为空，
          # 避免恰好 2000 条时把第 20 页满误判为超限。
          fetch_pages() {
            local label=$1 url=$2 key=$3 out_dir=$4
            local page=1 body count
            mkdir -p "$out_dir"
            while [ "$page" -le 20 ]; do
              body="$out_dir/page-${page}.json"
              if ! gh api "${url}&page=${page}" > "$body"; then
                echo "::error::查询 ${label} 失败（page ${page}），拒绝发布"
                exit 1
              fi
              count="$(json_page_count "$body" "$key")" || {
                echo "::error::${label} 响应非法（page ${page}），拒绝发布"
                exit 1
              }
              if [ "$count" -lt 100 ]; then
                return 0
              fi
              page=$((page + 1))
            done
            body="$out_dir/page-21.json"
            if ! gh api "${url}&page=21" > "$body"; then
              echo "::error::查询 ${label} 失败（page 21），拒绝发布"
              exit 1
            fi
            count="$(json_page_count "$body" "$key")" || {
              echo "::error::${label} 响应非法（page 21），拒绝发布"
              exit 1
            }
            if [ "$count" -ne 0 ]; then
              echo "::error::${label} 超过 20 页（page 21 仍有 ${count} 条），拒绝发布"
              exit 1
            fi
          }

          check_runs_url="repos/${repo}/commits/${sha}/check-runs?filter=all&per_page=100"
          workflow_runs_url="repos/${repo}/actions/runs?head_sha=${sha}&event=push&per_page=100"

          echo "查询目标 SHA ${sha} 的 check-runs 与 CI workflow run（repo=${repo}，只查该 SHA）"
          fetch_pages "目标 SHA ${sha} 的 check-runs" "$check_runs_url" "check_runs" "$work_dir/check-runs"
          fetch_pages "目标 SHA ${sha} 的 CI workflow runs" "$workflow_runs_url" "workflow_runs" "$work_dir/workflow-runs"

          python3 - "$sha" "$work_dir/check-runs" "$work_dir/workflow-runs" "${required[@]}" <<'PY'
          import glob
          import json
          import os
          import sys

          sha, check_dir, runs_dir, *required = sys.argv[1:]
          if not required:
              print("::error::CI 门禁未配置必需 check 名称", file=sys.stderr)
              raise SystemExit(2)


          def page_number(path):
              base = os.path.basename(path)
              if not (base.startswith("page-") and base.endswith(".json")):
                  raise SystemExit(f"非法分页文件名: {base}")
              try:
                  return int(base[5:-5])
              except ValueError:
                  raise SystemExit(f"非法分页文件名: {base}")


          def load_pages(directory, key):
              items = []
              for path in sorted(glob.glob(os.path.join(directory, "*.json")), key=page_number):
                  try:
                      with open(path, encoding="utf-8") as handle:
                          payload = json.load(handle)
                  except (OSError, ValueError) as exc:
                      print(
                          f"::error::{key} JSON 解析失败（{os.path.basename(path)}）: {exc}",
                          file=sys.stderr,
                      )
                      raise SystemExit(1)
                  if not isinstance(payload, dict) or not isinstance(payload.get(key), list):
                      print(
                          f"::error::{key} 响应缺少 {key} 数组（{os.path.basename(path)}）",
                          file=sys.stderr,
                      )
                      raise SystemExit(1)
                  items.extend(payload[key])
              return items


          def text(value):
              return value if isinstance(value, str) else ""


          def as_int(value):
              if isinstance(value, int):
                  return value
              if isinstance(value, str) and value.isdigit():
                  return int(value)
              return None


          def app_slug(run):
              app = run.get("app")
              return text(app.get("slug")) if isinstance(app, dict) else ""


          def suite_id(run):
              suite = run.get("check_suite")
              return as_int(suite.get("id")) if isinstance(suite, dict) else None


          check_runs = load_pages(check_dir, "check_runs")
          workflow_runs = load_pages(runs_dir, "workflow_runs")

          # 只认目标 SHA 的 CI workflow（.github/workflows/ci.yml）push run；
          # 用 workflow run 的 check_suite_id 与 check run 的 check_suite.id 关联，
          # 避免同名 check run 来自其它 workflow/App。CI run 必须成功完成。
          ci_runs = [
              run for run in workflow_runs
              if isinstance(run, dict)
              and run.get("path") == ".github/workflows/ci.yml"
              and run.get("event") == "push"
              and run.get("head_sha") == sha
          ]
          successful_ci_runs = [
              run for run in ci_runs
              if run.get("status") == "completed" and run.get("conclusion") == "success"
          ]
          ci_suite_ids = {
              as_int(run.get("check_suite_id"))
              for run in successful_ci_runs
          }
          ci_suite_ids.discard(None)

          problems = []
          if not successful_ci_runs:
              problems.append(
                  "CI workflow run: 目标 SHA 没有成功完成的 "
                  ".github/workflows/ci.yml push run"
              )

          for name in required:
              matching = [run for run in check_runs if isinstance(run, dict) and run.get("name") == name]
              if not matching:
                  problems.append(f"{name}: 缺失（目标 SHA 没有同名 check run）")
                  continue

              bad_apps = sorted({
                  app_slug(run) or "<空>"
                  for run in matching
                  if app_slug(run) != "github-actions"
              })
              if bad_apps:
                  problems.append(
                      f"{name}: check run app.slug 不是 github-actions（{','.join(bad_apps)}）"
                  )
                  continue

              bad_sha = sorted({
                  text(run.get("head_sha")) or "<空>"
                  for run in matching
                  if run.get("head_sha") != sha
              })
              if bad_sha:
                  problems.append(
                      f"{name}: head_sha 与目标 SHA 不一致 {','.join(bad_sha)}"
                  )
                  continue

              pending = sorted({
                  text(run.get("status")) or "<空>"
                  for run in matching
                  if run.get("status") != "completed"
              })
              if pending:
                  problems.append(f"{name}: 仍在运行/排队（status={','.join(pending)}）")
                  continue

              # 按 started_at 取最后启动的 attempt（同秒用 id 破并列），而不是
              # completed_at：更晚启动、更早完成的 failure 也必须被选中，避免
              # 旧 success 掩盖新 attempt 的失败。
              def attempt_key(run):
                  started = text(run.get("started_at"))
                  run_id = run.get("id")
                  return (started, run_id if isinstance(run_id, int) else -1)

              latest = max(matching, key=attempt_key)
              conclusion = latest.get("conclusion")
              if conclusion != "success":
                  problems.append(
                      f"{name}: 最新 check run 结论为 {text(conclusion) or '<空>'}，要求 success"
                  )
                  continue

              suite = suite_id(latest)
              if suite is None:
                  problems.append(f"{name}: 最新 check run 缺少 check_suite.id")
                  continue
              if suite not in ci_suite_ids:
                  problems.append(
                      f"{name}: 最新 check run 的 check_suite.id={suite} "
                      "不属于目标 SHA 的 CI workflow run"
                  )
                  continue

              print(f"OK {name}: success（check run {latest.get('id')}，suite {suite}）")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}", file=sys.stderr)
              print(
                  f"::error::目标 SHA {sha} 的 CI 门禁未通过（{len(problems)} 项），拒绝发布",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(f"CI 门禁通过：目标 SHA {sha} 的 {len(required)} 项 check 均为 success")
          PY

      - name: 安装 Rust stable（rustfmt / clippy）
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      # 必须在任何构建/推送之前完成。tag 与 workspace 版本必须一致（v 前缀）。
      - name: 校验 tag、workspace 版本与 main 祖先
        id: version
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag 必须形如 vX.Y.Z（可带预发布后缀），实际为 ${tag}"
            exit 1
          fi
          # Docker/GHCR tag 不允许 '+'，在昂贵的构建开始前明确拒绝。
          if [[ "$tag" == *"+"* ]]; then
            echo "::error::tag 不能包含 '+'（SemVer build metadata 不是合法镜像 tag）"
            exit 1
          fi

          metadata_file="$(mktemp)"
          trap 'rm -f "$metadata_file"' EXIT
          cargo metadata --locked --no-deps --format-version 1 > "$metadata_file"

          version="$(python3 - "$metadata_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)

          members = set(metadata.get("workspace_members") or [])
          if not members:
              raise SystemExit("cargo metadata 未返回 workspace_members")
          versions = {
              package.get("version")
              for package in metadata.get("packages", [])
              if package.get("id") in members
          }
          if len(versions) != 1:
              raise SystemExit(f"workspace 版本不一致或缺失: {sorted(v for v in versions if v)}")
          version = versions.pop()
          if not isinstance(version, str) or not version:
              raise SystemExit("workspace 版本为空")
          print(version)
          PY
          )"

          tag_version="${tag#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::tag ${tag} 与 Cargo.toml workspace 版本 ${version} 不一致"
            exit 1
          fi

          # 发布物必须来自 main 祖先提交；显式 fetch main 后再判断。
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_SHA} 不是 origin/main 的祖先，拒绝发布"
            exit 1
          fi

          if [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
          else
            stable=false
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"
          echo "版本校验通过: tag=${tag} version=${version} stable=${stable}"

      # 已发布的 tag 不重建、不覆盖资产；只允许重跑失败后留下的 draft。
      - name: 拒绝重跑已发布的 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/release-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-draft)" != "true" ]; then
              echo "::error::Release ${tag} 已发布；请发布新的 patch 版本，不要重跑已发布 tag"
              exit 1
            fi
            echo "检测到已有 draft Release，将在重建资产后发布"
          else
            echo "未发现 Release，将创建 draft"
          fi

      # notes 在 verify 内提取并作为 artifact 传给 release，避免 staging 已推送后才发现缺失。
      - name: 提取 CHANGELOG 发布说明
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-meta
          release_notes="$(bash packaging/release-notes.sh "$VERSION" CHANGELOG.md)"
          test -n "$release_notes"
          printf '%s\n' "$release_notes" > release-meta/release-notes.md
          test -s release-meta/release-notes.md

      - name: 缓存 cargo 与 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 格式检查
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Clippy（警告即错误）
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 单元与集成测试
        run: |
          set -euo pipefail
          cargo test --workspace --locked

      - name: 缓存 cargo-audit
        id: cache-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1

      - name: 安装 cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked

      - name: 依赖漏洞扫描
        run: |
          set -euo pipefail
          cargo audit

      # SBOM 也前移到 verify：避免 manifest 已推 staging 后才发现 cargo metadata 失败。
      - name: 生成 SPDX SBOM（x86_64 / aarch64）
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          python3 packaging/sbom.py \
            --output release-meta/sbom-x86_64.spdx.json \
            --version "$VERSION" \
            --revision "$GITHUB_SHA" \
            --arch x86_64
          python3 packaging/sbom.py \
            --output release-meta/sbom-aarch64.spdx.json \
            --version "$VERSION" \
            --revision "$GITHUB_SHA" \
            --arch aarch64
          test -s release-meta/sbom-x86_64.spdx.json
          test -s release-meta/sbom-aarch64.spdx.json

      - name: 上传发布说明与 SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-meta
          path: release-meta
          retention-days: 7
          if-no-files-found: error

      - name: 安装 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # web/dist 只在这里构建一次；build/images 通过 artifact 复用，避免 arm64 重复 pnpm。
      - name: 前端类型检查、单测与构建
        working-directory: web
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build

      - name: 上传前端产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error

  # verify 里的 `cargo test --workspace` 未设置 RUSTBOARD_TEST_PG，PostgreSQL
  # 用例会打印 SKIP 并被 cargo 记为 passed；发布必须再依赖这个实库 job，
  # 不能只靠人工环境审批。
  postgres:
    name: postgres / 发布前实库门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rustboard
          POSTGRES_PASSWORD: rb-release-pg-9f3a
          POSTGRES_DB: rustboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustboard -d rustboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTBOARD_TEST_PG: postgres://rustboard:rb-release-pg-9f3a@localhost:5432/rustboard?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: 缓存 cargo 与 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装 PostgreSQL 16 客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version

      - name: 等待 PostgreSQL 就绪
        run: |
          for i in $(seq 1 30); do
            if timeout 1 bash -c ': > /dev/tcp/127.0.0.1/5432' 2>/dev/null; then
              echo "PostgreSQL 已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL 在 30 秒内未就绪" >&2
          exit 1

      - name: Phase D 实库测试（schema / core / parity / migrate / load）
        run: >-
          cargo test -p rustboard-core
          --test postgres_schema
          --test postgres_core
          --test postgres_parity
          --test postgres_migrate
          --test postgres_load
          --locked

      - name: Phase D5b backup/restore + 安装器 PG 探测
        run: |
          cargo test -p rustboard-hub --test phase_d_backup --locked
          cargo test -p rustboard-hub --bin rustboard-hub install_cmd::tests --locked

  # #54 第二层门禁：不信任历史 CI 结论，在发布流程内对目标 SHA 重跑关键安全 E2E。
  # 依赖 verify（CI 查询门禁先过），与 build 并行；release 必须等本 job 成功。
  # ci.yml 的 e2e 未显式设置超时（GitHub 默认 360 分钟）；这里同样给 360 兜底，
  # 避免慢 runner 把正确结果误判为超时（近期 CI 全量 e2e 约 9 分钟）。
  security-e2e:
    name: 安全 E2E 重跑（security / cert-rotation / hardening / control / v041）
    permissions:
      contents: read
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出目标提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 安装 Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: 缓存 cargo 与 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # 与 ci.yml 的 e2e job 一致：部分脚本需要仓库内 web/dist。
      - name: 构建前端资源
        working-directory: web
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      # security/cert-rotation/hardening/control/v041 只依赖 python3 标准库、
      # curl、timeout 与 GNU coreutils；缺什么装什么，避免 runner 镜像差异误判。
      - name: 检查 e2e 基础依赖
        run: |
          set -euo pipefail
          missing=()
          for cmd in python3 curl timeout; do
            if ! command -v "$cmd" > /dev/null 2>&1; then
              case "$cmd" in
                timeout) missing+=(coreutils) ;;
                *) missing+=("$cmd") ;;
              esac
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          python3 -V
          curl --version | sed -n '1p'
          timeout --version | sed -n '1p'

      - name: 失败日志脱敏自测（security.sh）
        env:
          SECURITY_E2E_SELFTEST: "1"
        run: |
          set -euo pipefail
          test -f tests/e2e/security.sh
          bash tests/e2e/security.sh

      - name: 安全回归（security.sh）
        run: |
          set -euo pipefail
          test -f tests/e2e/security.sh
          bash tests/e2e/security.sh

      - name: 控制面失败日志脱敏自测
        run: |
          set -euo pipefail
          test -f tests/e2e/control_redact_test.sh
          bash tests/e2e/control_redact_test.sh

      - name: 证书轮换回归（cert-rotation.sh）
        run: |
          set -euo pipefail
          test -f tests/e2e/cert-rotation.sh
          bash tests/e2e/cert-rotation.sh

      - name: 安全硬化回归（hardening.sh）
        run: |
          set -euo pipefail
          test -f tests/e2e/hardening.sh
          bash tests/e2e/hardening.sh

      - name: 控制面回归（control.sh）
        run: |
          set -euo pipefail
          test -f tests/e2e/control.sh
          bash tests/e2e/control.sh

      - name: v0.4.1 回归（v041.sh）
        run: |
          set -euo pipefail
          test -f tests/e2e/v041.sh
          bash tests/e2e/v041.sh

  # 2. 两架构原生构建：静态 musl 二进制 + 离线包 + 包内校验和。
  build:
    name: 构建 ${{ matrix.arch }} 离线包
    permissions:
      contents: read
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            pkgarch: x86_64
            runner: ubuntu-latest
          # 公开仓库可用的 GitHub 原生 arm64 runner；避免 QEMU 构建。
          - arch: arm64
            pkgarch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 下载前端产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      - name: 安装 buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 构建静态二进制与离线包
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/build-release.sh \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --revision "$GITHUB_SHA" \
            --web-dir web/dist \
            --out dist

      - name: 校验构建产物布局
        run: |
          set -euo pipefail
          for role in hub panel agent; do
            test -f "dist/${{ matrix.arch }}/bin/rustboard-${role}"
          done
          compgen -G "dist/serverdashboard-v*-${{ matrix.pkgarch }}.tar.gz" > /dev/null
          test -f "dist/SHA256SUMS.${{ matrix.pkgarch }}"
          file "dist/${{ matrix.arch }}/bin/rustboard-hub"
          ls -l dist

      - name: 上传 dist（供 images / manifest / release 使用）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  # 发布前的真实交付门禁：x86_64 离线包在独立 netns 中完成三角色安装与本地启动。
  # 失败则 release 不运行（staging 镜像可能已存在，但不会创建正式 tag / Release）。
  delivery-e2e:
    name: 离线安装 e2e（x86_64）
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 下载 x86_64 离线包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-amd64
          path: dist

      # v100-offline 的 provenance 校验需要仓库内 web/dist（fail-closed）；与 build job 一致。
      - name: 下载前端产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      # v100-offline 的来源校验会直接读取 dist/<arch>/bin；artifact 不保留权限，
      # 统一恢复目标二进制可执行位，避免把 0644 误判成构建问题。
      - name: 恢复构建产物可执行位（artifact 不保留权限）
        run: |
          set -euo pipefail
          find dist -type f -path '*/bin/rustboard-*' -exec chmod 0755 {} +
          find dist -type f -path '*/bin/rustboard-*' -print

      - name: 安装 e2e 依赖（缺什么装什么）
        run: |
          set -euo pipefail
          missing=()
          for cmd in strace unshare ip curl file; do
            if ! command -v "$cmd" > /dev/null 2>&1; then
              case "$cmd" in
                ip) missing+=(iproute2) ;;
                unshare) missing+=(util-linux) ;;
                *) missing+=("$cmd") ;;
              esac
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: 运行离线安装 e2e
        run: |
          set -euo pipefail
          package=""
          for candidate in dist/serverdashboard-v*-x86_64.tar.gz; do
            if [ -f "$candidate" ]; then
              package="$candidate"
              break
            fi
          done
          if [ -z "$package" ]; then
            echo "::error::找不到 x86_64 离线包"
            exit 1
          fi
          package="$(readlink -f "$package")"
          e2e_script="$PWD/tests/e2e/v100-offline.sh"
          test -f "$e2e_script"
          sudo env PACKAGE="$package" SKIP_BUILD=1 STRICT=1 bash "$e2e_script"

  # 发布前的 Docker 交付门禁：ubuntu-latest 上本地 buildx --load amd64 三镜像并
  # 原生跑全部运行时用例；只建本地 tag，不登录、不推送 GHCR。arm64 由
  # delivery-arm64 在原生 arm64 runner 覆盖，所以这里显式 SKIP_ARM64=1，
  # 避免在同一 amd64 门禁里再用 QEMU 重复验证 arm64。
  delivery-docker:
    name: Docker 交付 e2e（amd64）
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 下载 amd64 离线包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-amd64
          path: dist

      # v100-docker 的来源校验需要仓库内 web/dist（fail-closed）；与 build job 一致。
      - name: 下载前端产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      # v100-docker 要求 dist/$DOCKER_ARCH/bin 三个二进制可执行；artifact 不保留
      # 权限，下载后统一恢复，避免 S.1 把 0644 误判成交付错误。
      - name: 恢复构建产物可执行位（artifact 不保留权限）
        run: |
          set -euo pipefail
          find dist -type f -path '*/bin/rustboard-*' -exec chmod 0755 {} +
          find dist -type f -path '*/bin/rustboard-*' -print

      # docker/buildx 由 hosted runner 预装；compose 插件缺失时脚本回退 PyYAML。
      - name: 安装 e2e 依赖（缺什么装什么）
        run: |
          set -euo pipefail
          missing=()
          for cmd in python3 curl git tar sha256sum timeout; do
            if ! command -v "$cmd" > /dev/null 2>&1; then
              case "$cmd" in
                sha256sum | timeout) missing+=(coreutils) ;;
                *) missing+=("$cmd") ;;
              esac
            fi
          done
          if ! docker compose version > /dev/null 2>&1 \
            && ! python3 -c 'import yaml' > /dev/null 2>&1; then
            missing+=(python3-yaml)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          docker version
          docker buildx version

      - name: 运行 Docker 交付 e2e（amd64）
        run: |
          set -euo pipefail
          test -f tests/e2e/v100-docker.sh
          SKIP_ARM64=1 DOCKER_ARCH=amd64 bash tests/e2e/v100-docker.sh

      # #87/#88：真实 agent 在 PG overlay 下落库、Compose 8080 回环发布。
      # 该脚本需要固定宿主端口 8080/8443，hosted runner 默认空闲。
      - name: Docker + PostgreSQL overlay e2e（#87/#88）
        run: |
          set -euo pipefail
          test -f tests/e2e/v100-docker-pg.sh
          manifest=$(mktemp)
          {
            printf 'hub=%s\n' "$(sha256sum dist/amd64/bin/rustboard-hub | cut -d' ' -f1)"
            printf 'panel=%s\n' "$(sha256sum dist/amd64/bin/rustboard-panel | cut -d' ' -f1)"
            printf 'agent=%s\n' "$(sha256sum dist/amd64/bin/rustboard-agent | cut -d' ' -f1)"
            printf 'web=%s\n' "$(sha256sum web/dist/index.html | cut -d' ' -f1)"
          } > "$manifest"
          EXPECTED_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test -n "$EXPECTED_VERSION"
          EXPECTED_VERSION="$EXPECTED_VERSION" bash tests/e2e/v100-docker-pg.sh --dist-manifest "$manifest"

  # 发布前的原生 arm64 交付门禁：先在 arm64 runner 上安装/启动 aarch64 离线包，
  # 再原生构建并运行三镜像 Docker e2e；不使用 QEMU，也不推送 GHCR。
  delivery-arm64:
    name: arm64 交付 e2e（原生）
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 下载 arm64 离线包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-arm64
          path: dist

      - name: 下载前端产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      # v100-arm64 与随后的 Docker e2e 都要求 dist/arm64/bin 可执行；artifact
      # 不保留权限，下载后统一恢复目标二进制。
      - name: 恢复构建产物可执行位（artifact 不保留权限）
        run: |
          set -euo pipefail
          find dist -type f -path '*/bin/rustboard-*' -exec chmod 0755 {} +
          find dist -type f -path '*/bin/rustboard-*' -print

      # v100-arm64 需要 root（/opt 临时 prefix）与 file/curl/ss；Docker 部分需要
      # compose 插件或 PyYAML 回退。docker/buildx 由 arm64 hosted runner 预装。
      - name: 安装 e2e 依赖（缺什么装什么）
        run: |
          set -euo pipefail
          missing=()
          for cmd in python3 file curl tar sha256sum timeout; do
            if ! command -v "$cmd" > /dev/null 2>&1; then
              case "$cmd" in
                sha256sum | timeout) missing+=(coreutils) ;;
                *) missing+=("$cmd") ;;
              esac
            fi
          done
          if ! command -v ss > /dev/null 2>&1; then
            missing+=(iproute2)
          fi
          if ! docker compose version > /dev/null 2>&1 \
            && ! python3 -c 'import yaml' > /dev/null 2>&1; then
            missing+=(python3-yaml)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          docker version
          docker buildx version

      - name: 运行 arm64 离线包 e2e（原生）
        run: |
          set -euo pipefail
          package=""
          for candidate in dist/serverdashboard-v*-aarch64.tar.gz; do
            if [ -f "$candidate" ]; then
              package="$candidate"
              break
            fi
          done
          if [ -z "$package" ]; then
            echo "::error::找不到 aarch64 离线包"
            exit 1
          fi
          package="$(readlink -f "$package")"
          e2e_script="$PWD/tests/e2e/v100-arm64.sh"
          test -f "$e2e_script"
          sudo env PACKAGE="$package" SKIP_BUILD=1 STRICT=1 bash "$e2e_script"

      - name: 运行 Docker 交付 e2e（arm64 原生）
        run: |
          set -euo pipefail
          test -f tests/e2e/v100-docker.sh
          DOCKER_ARCH=arm64 SKIP_ARM64=1 bash tests/e2e/v100-docker.sh

  # 3. 每个架构分别构建并推送三个镜像的临时 tag：<tag>-<arch>。
  images:
    name: 镜像 ${{ matrix.role }} / ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    needs:
      - verify
      - build
      # #54 第二层未通过时不得推送任何 staging/正式镜像 tag。
      - security-e2e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            role: hub
            runner: ubuntu-latest
          - arch: amd64
            role: panel
            runner: ubuntu-latest
          - arch: amd64
            role: agent
            runner: ubuntu-latest
          - arch: arm64
            role: hub
            runner: ubuntu-24.04-arm
          - arch: arm64
            role: panel
            runner: ubuntu-24.04-arm
          - arch: arm64
            role: agent
            runner: ubuntu-24.04-arm
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 下载对应架构 dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist

      - name: 下载前端产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      - name: 安装 buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: 构建并推送 ${{ matrix.role }} 临时架构 tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/pazzifirst/rustboard-${{ matrix.role }}"
          docker buildx build \
            --file docker/Dockerfile \
            --target "${{ matrix.role }}" \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --provenance=mode=max \
            --sbom=true \
            --tag "${image}:${TAG}-${{ matrix.arch }}" \
            --push \
            .
          echo "已推送 ${image}:${TAG}-${{ matrix.arch }}"

  # 4. 只合成 staging 多架构 tag；正式 :${TAG} 留到 release 全部成功后提升。
  manifest:
    name: 合成多架构 manifest
    permissions:
      contents: read
      packages: write
    needs:
      - verify
      - build
      - images
      - security-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 下载 amd64 dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-amd64
          path: dist

      - name: 下载 arm64 dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-arm64
          path: dist

      # 合并镜像前先确认两个架构的包与发布脚本生成的校验和一致。
      - name: 校验两架构 dist 与 SHA256SUMS
        run: |
          set -euo pipefail
          for pkgarch in x86_64 aarch64; do
            test -f "dist/SHA256SUMS.${pkgarch}"
            compgen -G "dist/serverdashboard-v*-${pkgarch}.tar.gz" > /dev/null
            (
              cd dist
              sha256sum -c --strict "SHA256SUMS.${pkgarch}"
            )
          done

      - name: 安装 buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: 合成 manifest、校验架构并写 digest
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/image-digests.txt

          for role in hub panel agent; do
            image="ghcr.io/pazzifirst/rustboard-${role}"

            docker buildx imagetools create -t "${image}:${TAG}-staging" \
              "${image}:${TAG}-amd64" \
              "${image}:${TAG}-arm64"

            raw_manifest="$(docker buildx imagetools inspect --raw "${image}:${TAG}-staging")"
            printf '%s' "$raw_manifest" | python3 -c '
          import json
          import sys

          image = sys.argv[1]
          manifest = json.load(sys.stdin)
          architectures = {
              entry.get("platform", {}).get("architecture")
              for entry in manifest.get("manifests", [])
          }
          missing = {"amd64", "arm64"} - architectures
          if missing:
              missing_text = ",".join(sorted(missing))
              raise SystemExit(f"{image} manifest 缺少架构: {missing_text}")
          arch_text = ",".join(sorted(a for a in architectures if a))
          print(f"{image} manifest 架构: {arch_text}")
          ' "$image"

            digest="$(docker buildx imagetools inspect "${image}:${TAG}-staging" --format '{{.Manifest.Digest}}')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${image}:${TAG}-staging 的 digest 非法: ${digest}"
              exit 1
            fi
            printf '%s %s\n' "$image" "$digest" >> dist/image-digests.txt
          done

          cat dist/image-digests.txt

      - name: 上传镜像 digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digests
          path: dist/image-digests.txt
          retention-days: 7
          if-no-files-found: error

  # 5. 资产/SBOM/attestation 全部成功后：staging -> 正式 tag + sha tag -> latest -> 发布 draft。
  release:
    name: 发布 GitHub Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    needs:
      - verify
      - postgres
      - manifest
      - delivery-e2e
      - delivery-docker
      - delivery-arm64
      # #54 第二层：发布流程内重跑的安全 E2E 失败时，不得创建/发布正式 Release。
      - security-e2e
    # 正式 tag/sha/latest 提升与 Release 发布前的最后人工闸门：
    # GitHub 仓库需在 Settings -> Environments -> release 配置 required reviewers。
    # 人工 approval 只是附加闸门，不能替代 verify/postgres/security-e2e 的自动门禁。
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # imagetools 用于 staging -> 正式 tag 的提升；固定安装 buildx 避免依赖 runner 状态。
      - name: 安装 buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 下载 amd64 dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-amd64
          path: dist

      - name: 下载 arm64 dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-arm64
          path: dist

      - name: 下载镜像 digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-digests
          path: dist

      - name: 下载发布说明与 SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-meta
          path: dist

      - name: 校验发布资产并生成跨架构 SHA256SUMS
        run: |
          set -euo pipefail
          test -s dist/release-notes.md
          test -s dist/sbom-x86_64.spdx.json
          test -s dist/sbom-aarch64.spdx.json
          test -s dist/image-digests.txt
          test -s dist/SHA256SUMS.x86_64
          test -s dist/SHA256SUMS.aarch64
          (cd dist && sha256sum -c SHA256SUMS.x86_64 && sha256sum -c SHA256SUMS.aarch64)

          tarball_count="$(compgen -G "dist/serverdashboard-v*-*.tar.gz" | wc -l)"
          if [ "$tarball_count" -ne 2 ]; then
            echo "::error::期望 2 个 tarball，实际 ${tarball_count} 个"
            exit 1
          fi

          # 跨架构校验和覆盖 tarball、SBOM 与镜像 digest；per-arch SHA256SUMS 单独上传。
          (
            cd dist
            sha256sum serverdashboard-*.tar.gz sbom-*.spdx.json image-digests.txt > SHA256SUMS
          )
          test -s dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: 创建或复用 draft Release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          STABLE: ${{ needs.verify.outputs.stable }}
        run: |
          set -euo pipefail
          create_flags=()
          edit_flags=()
          if [ "$STABLE" = "true" ]; then
            edit_flags+=(--prerelease=false)
          else
            create_flags+=(--prerelease)
            edit_flags+=(--prerelease)
          fi

          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/release-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-draft)" != "true" ]; then
              echo "::error::Release ${TAG} 已发布，拒绝覆盖资产"
              exit 1
            fi
            gh release edit "$TAG" \
              --title "RustBoard ${TAG}" \
              --notes-file dist/release-notes.md \
              "${edit_flags[@]}"
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "RustBoard ${TAG}" \
              --notes-file dist/release-notes.md \
              "${create_flags[@]}"
          fi
          gh release upload "$TAG" \
            dist/serverdashboard-*.tar.gz \
            dist/SHA256SUMS \
            dist/SHA256SUMS.x86_64 \
            dist/SHA256SUMS.aarch64 \
            dist/sbom-*.spdx.json \
            dist/image-digests.txt \
            --clobber

      - name: 生成 tarball / SBOM 的 artifact attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/sbom-*.spdx.json

      - name: 读取镜像 digest
        id: digests
        run: |
          set -euo pipefail
          for role in hub panel agent; do
            image="ghcr.io/pazzifirst/rustboard-${role}"
            digest="$(awk -v image="$image" '$1 == image { print $2 }' dist/image-digests.txt)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${image} 的 digest 缺失或非法: ${digest}"
              exit 1
            fi
            echo "${role}=${digest}" >> "$GITHUB_OUTPUT"
          done

      # 写入 registry 的 attestation 需要 docker 凭据；token 只进 stdin。
      - name: 登录 GHCR（写入镜像 attestation）
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: hub 镜像 attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/pazzifirst/rustboard-hub
          subject-digest: ${{ steps.digests.outputs.hub }}
          push-to-registry: true

      - name: panel 镜像 attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/pazzifirst/rustboard-panel
          subject-digest: ${{ steps.digests.outputs.panel }}
          push-to-registry: true

      - name: agent 镜像 attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/pazzifirst/rustboard-agent
          subject-digest: ${{ steps.digests.outputs.agent }}
          push-to-registry: true

      # 资产与全部 attestation 成功后才把 staging 提升为正式 tag 与 sha-<short>；
      # 失败则 Release 保持 draft。
      # 提升前再次核对远端 tag 的 peeled commit：tag 在构建/审批期间被移动时
      # 绝不能把旧 SHA 的镜像提升到被移动的 tag 名下。
      - name: 提升前校验远端 tag 未被移动（peeled SHA == GITHUB_SHA）
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${TAG}"
          if ! remote="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"; then
            echo "::error::无法读取远端 tag ${TAG}"
            exit 1
          fi
          peeled="$(printf '%s\n' "$remote" | awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }')"
          direct="$(printf '%s\n' "$remote" | awk -v ref="$tag_ref" '$2 == ref { print $1 }')"
          if [ -z "$peeled" ] && [ -z "$direct" ]; then
            echo "::error::远端不存在 tag ${TAG}"
            exit 1
          fi
          target="${peeled:-$direct}"
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::远端 tag ${TAG} peeled=${target:-<空>}，与目标 ${GITHUB_SHA} 不一致（tag 可能被移动）"
            exit 1
          fi
          echo "远端 tag ${TAG} 指向 ${target}，与 GITHUB_SHA 一致"

      - name: 将 staging 提升为正式 tag 与 sha-<short> 并校验 digest
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          if [[ ! "$short_sha" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::GITHUB_SHA 前 12 位不是合法短 SHA: ${short_sha}"
            exit 1
          fi

          for role in hub panel agent; do
            image="ghcr.io/pazzifirst/rustboard-${role}"
            staging_expected="$(awk -v image="$image" '$1 == image { print $2 }' dist/image-digests.txt)"
            if [[ ! "$staging_expected" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${image} 的 staging digest 缺失或非法: ${staging_expected}"
              exit 1
            fi

            staging_live="$(docker buildx imagetools inspect \
              "${image}:${TAG}-staging" --format '{{.Manifest.Digest}}')"
            if [ "$staging_live" != "$staging_expected" ]; then
              echo "::error::${image} staging digest 已变化: 期望 ${staging_expected}，实际 ${staging_live}"
              exit 1
            fi

            docker buildx imagetools create \
              -t "${image}:${TAG}" \
              -t "${image}:sha-${short_sha}" \
              "${image}:${TAG}-staging"

            promoted="$(docker buildx imagetools inspect \
              "${image}:${TAG}" --format '{{.Manifest.Digest}}')"
            if [ "$promoted" != "$staging_expected" ]; then
              echo "::error::${image} 正式 tag digest 与 staging 不一致: 期望 ${staging_expected}，实际 ${promoted}"
              exit 1
            fi

            promoted_sha="$(docker buildx imagetools inspect \
              "${image}:sha-${short_sha}" --format '{{.Manifest.Digest}}')"
            if [ "$promoted_sha" != "$staging_expected" ]; then
              echo "::error::${image} sha tag digest 与 staging 不一致: 期望 ${staging_expected}，实际 ${promoted_sha}"
              exit 1
            fi
            echo "已提升 ${image}:${TAG} 与 ${image}:sha-${short_sha} = ${promoted}"
          done

      # B-G9：正式 tag 与 sha tag 都提升成功后才补 latest；失败则 Release 保持 draft。
      # 仅在稳定 tag（纯 X.Y.Z）时执行；预发布 tag 不移动 latest。
      - name: 补 latest（仅稳定版）
        if: needs.verify.outputs.stable == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for role in hub panel agent; do
            image="ghcr.io/pazzifirst/rustboard-${role}"
            docker buildx imagetools create -t "${image}:latest" "${image}:${TAG}"
            formal="$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{.Manifest.Digest}}')"
            latest="$(docker buildx imagetools inspect "${image}:latest" --format '{{.Manifest.Digest}}')"
            if [ "$formal" != "$latest" ]; then
              echo "::error::${image}:latest digest 与 ${TAG} 不一致: formal=${formal} latest=${latest}"
              exit 1
            fi
          done

      # 只有前面所有步骤（含 latest 提升）成功才会执行；失败时 draft 保留，不 publish。
      # 发布前再核对一次远端 tag，覆盖提升/attestation 期间的 TOCTOU。
      - name: 发布前再次校验远端 tag 未被移动（peeled SHA == GITHUB_SHA）
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${TAG}"
          if ! remote="$(git ls-remote origin "$tag_ref" "$tag_ref^{}")"; then
            echo "::error::无法读取远端 tag ${TAG}"
            exit 1
          fi
          peeled="$(printf '%s\n' "$remote" | awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }')"
          direct="$(printf '%s\n' "$remote" | awk -v ref="$tag_ref" '$2 == ref { print $1 }')"
          if [ -z "$peeled" ] && [ -z "$direct" ]; then
            echo "::error::远端不存在 tag ${TAG}"
            exit 1
          fi
          target="${peeled:-$direct}"
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::远端 tag ${TAG} peeled=${target:-<空>}，与目标 ${GITHUB_SHA} 不一致（tag 可能被移动）"
            exit 1
          fi
          echo "远端 tag ${TAG} 指向 ${target}，与 GITHUB_SHA 一致"

      - name: 发布 Release（取消 draft）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "已发布 Release ${TAG}"
