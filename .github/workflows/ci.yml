name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每周拉一次最新 advisory，即使没有代码变更也能发现新漏洞
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: 缓存 cargo 与 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 单元与集成测试
        run: cargo test --workspace --locked

  e2e:
    name: e2e 安全回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 缓存 cargo 与 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装 Node 22（面板 e2e 需要构建前端）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: 构建前端资源
        run: |
          corepack enable
          cd web && pnpm install --frozen-lockfile && pnpm build

      - name: 运行安全回归
        run: bash tests/e2e/security.sh

      - name: 证书轮换回归
        run: bash tests/e2e/cert-rotation.sh

      - name: 面板回归
        run: bash tests/e2e/panel.sh

      - name: 安全硬化回归
        run: bash tests/e2e/hardening.sh

      - name: 控制面回归
        run: bash tests/e2e/control.sh

      - name: v0.3.2 控制面可靠性回归
        run: bash tests/e2e/v032.sh

  web:
    name: web / tsc / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: 启用 pnpm（版本由 packageManager 固定）
        run: corepack enable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与单测
        run: |
          pnpm exec tsc --noEmit
          pnpm test

      - name: 构建
        run: pnpm build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 缓存 cargo-audit 二进制
        id: cache-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1

      - name: 安装 cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: 依赖漏洞扫描
        run: cargo audit
