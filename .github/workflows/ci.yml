name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每周拉一次最新 advisory，即使没有代码变更也能发现新漏洞
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: 缓存 cargo 与 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告即错误）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 单元与集成测试
        run: cargo test --workspace --locked

  postgres:
    name: postgres / Phase D 实库测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rustboard
          POSTGRES_PASSWORD: rb-ci-secret-9f3a
          POSTGRES_DB: rustboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustboard -d rustboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # 实库测试每个用例 CREATE/DROP DATABASE（库名带 pid/nanos/seq），
      # 官方 postgres 镜像的 POSTGRES_USER 即 superuser，满足 CREATEDB。
      RUSTBOARD_TEST_PG: postgres://rustboard:rb-ci-secret-9f3a@localhost:5432/rustboard?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: 缓存 cargo 与 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装 PostgreSQL 客户端（pg_dump/pg_restore 16）
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          # 服务端固定 postgres:16；显式优先 16 的客户端，避免 runner 上已有
          # 更高版本导致 pg_dump 生成 PG16 不认识的 SET transaction_timeout。
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version

      - name: 等待 PostgreSQL 就绪
        run: |
          for i in $(seq 1 30); do
            if timeout 1 bash -c ': > /dev/tcp/127.0.0.1/5432' 2>/dev/null; then
              echo "PostgreSQL 已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL 在 30 秒内未就绪" >&2
          exit 1

      - name: Phase D 实库测试（schema / core / parity / migrate / load）
        run: >-
          cargo test -p rustboard-core
          --test postgres_schema
          --test postgres_core
          --test postgres_parity
          --test postgres_migrate
          --test postgres_load
          --locked

      - name: Phase D5b backup/restore + 安装器 PG 探测
        run: |
          cargo test -p rustboard-hub --test phase_d_backup --locked
          cargo test -p rustboard-hub --bin rustboard-hub install_cmd::tests --locked

  e2e:
    name: e2e 安全回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 缓存 cargo 与 target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装 Node 22（面板 e2e 需要构建前端）
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: 构建前端资源
        run: |
          corepack enable
          cd web && pnpm install --frozen-lockfile && pnpm build

      - name: 运行安全回归
        run: bash tests/e2e/security.sh

      - name: 证书轮换回归
        run: bash tests/e2e/cert-rotation.sh

      - name: 面板回归
        run: bash tests/e2e/panel.sh

      - name: 安全硬化回归
        run: bash tests/e2e/hardening.sh

      - name: 控制面回归
        run: bash tests/e2e/control.sh

      - name: v0.3.2 控制面可靠性回归
        run: bash tests/e2e/v032.sh

      - name: v0.3.3 管理面安全回归
        run: bash tests/e2e/v033.sh

      - name: v0.3.4 低风险硬化回归
        run: bash tests/e2e/v034.sh

      - name: v0.3.5 安全收口回归
        run: bash tests/e2e/v035.sh

      - name: M4 告警与归档回归
        run: bash tests/e2e/v040.sh

      - name: v0.4.1 已知问题修复回归
        run: bash tests/e2e/v041.sh

  web:
    name: web / tsc / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: 启用 pnpm（版本由 packageManager 固定）
        run: corepack enable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与单测
        run: |
          pnpm exec tsc --noEmit
          pnpm test

      - name: 构建
        run: pnpm build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 缓存 cargo-audit 二进制
        id: cache-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1

      - name: 安装 cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: 依赖漏洞扫描
        run: cargo audit
